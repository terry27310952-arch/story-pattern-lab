name: Story Engine Tests

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/streamlit/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/streamlit/requirements.txt

      - name: Compile production pipelines
        run: |
          python -m py_compile \
            apps/streamlit/content_modes.py \
            apps/streamlit/mode_resource_pipeline.py \
            apps/streamlit/trader_pipeline.py \
            apps/streamlit/story_engine_v3.py \
            apps/streamlit/story_content_pipeline_v3.py \
            apps/streamlit/story_renderer_v3.py \
            apps/streamlit/mode_exporter_v3.py \
            apps/streamlit/story_output_guard.py \
            apps/streamlit/app_v2.py \
            streamlit_app.py \
            tests/run_regression_suite.py \
            tests/test_story_v8.py

      - name: Compile compatibility modules
        run: |
          python -m py_compile \
            apps/streamlit/story_engine_v2.py \
            apps/streamlit/story_content_pipeline_v2.py \
            apps/streamlit/story_renderer_v2.py \
            apps/streamlit/mode_exporter_v2.py \
            apps/streamlit/story_engine.py \
            apps/streamlit/story_mode_policy.py \
            apps/streamlit/story_content_pipeline.py \
            apps/streamlit/story_pipeline_runtime.py \
            apps/streamlit/story_source_runtime.py \
            apps/streamlit/story_deck_runtime.py \
            apps/streamlit/story_render_runtime.py \
            apps/streamlit/story_export_runtime.py \
            apps/streamlit/mode_exporter.py

      - name: Run regression tests
        run: python tests/run_regression_suite.py
